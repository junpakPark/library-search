spring:
  config:
    activate:
      on-profile: test

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

external:
  naver:
    url: https://openapi.naver.com
    headers:
      client-id: 123
      client-secret: 123
  kakao:
    url: https://dapi.kakao.com
    headers:
      rest-api-key: test


resilience4j:
  circuitbreaker:
    configs:
      defaults:
        sliding-window-size: 100
        minimum-number-of-calls: 10
        wait-duration-in-open-state:
          seconds: 20
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 10

